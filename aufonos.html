<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundMax Audífonos</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #111;
            color: white;
        }

        header{
            background-color: black;
            padding: 20px;
            text-align: center;
        }

        header h1{
            font-size: 40px;
            color: #00d9ff;
        }

        nav{
            margin-top: 10px;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        .hero{
            height: 400px;
            background-image: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h2{
            font-size: 50px;
            background-color: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
        }

        .productos{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 40px;
            gap: 20px;
        }
